<!doctype html>
<html lang="fr">
<!-- VERSION v5.23.1 : chercher "v5.23" (Ctrl+U, Ctrl+F).
     v5.23.1 = (a) LIVE en ROUGE vif #e63946 (trace pointillee +
     pointeur live, etait orange). (b) bloc commentaire/photo de
     l ancienne photo MASQUE en mode direct (restaure a la sortie).
     (c) badge de debug tr:/pts:/age: RETIRE (live valide terrain).
     v5.23.0 = (1) FIX TRACES AU ZOOM MAX : coordonnees SVG en
     pixels monde absolus (~8 M px au z16) -> precision perdue,
     traces effacees au fort zoom. Desormais coordonnees RELATIVES
     a la fenetre visible (traces ET live). (2) option Direct dans
     le selecteur de dates en mode direct + badge km LIVE
     approximatif "> xx km" (laptop et smartphone, vue photo).
     v5.22.6 = TIRETS du pointille live ECHELLES sur le zoom
     (dasharray ~x2 par niveau de zoom) : en pixels ecran, ils se
     serraient au dezoom jusqu a paraitre une ligne continue.
     v5.22.5 = pointille trace live ORANGE (#ff9f1c) et EPAIS (5px,
     etait gris 3px) - trop discret sur smartphone. Alti live et
     pointille laptop VALIDES sur replay.
     v5.22.4 = FIX CSS : le pointille live (id "tracelive" depuis
     v5.22.2) n avait PAS le positionnement absolute/overflow ->
     SVG de taille nulle, trace invisible (badge tr:1 pts:9 mais
     rien sur la carte). Alti live VALIDE sur replay (courbe qui
     grandit, pts = gpx decime 1/2 - attendu).
     v5.22.3 = FIX TRACE LIVE : le geojson n etait charge QUE si
     live.json changeait - un seul echec le laissait vide A VIE
     (curseur OK, pointille + alti morts : cas reel console,
     liveTrace.length=0). Rechargement si change OU vide, + badge
     DIAGNOSTIC en mode direct (tr:/pts:/age:) pour lire l etat
     a l ecran sans console.
     v5.22.2 = FIX : (a) le calque pointille de la trace live s EMPI LAIT
     a chaque render (id duplique, jamais purges) - fuite + rendu
     degrade au fil d une journee de live. id dedie + purge.
     (b) echec de chargement de live_trace.geojson desormais LOGGE en
     console (avant : avale silencieusement -> pointille et alti live
     vides sans aucune piste de diagnostic).
     v5.22.1 = FIXES TERRAIN (1re sortie testee) : (1) la carte se
     CENTRE sur la position live a l entree en mode direct + SUIVI a
     chaque nouveau point (le tracé pointille etait dessine mais
     HORS ECRAN, carte centree sur l ancienne journee). (2) mobile :
     vraie 2F carte+alti (photo masquee en direct, classe .direct).
     v5.22.0 = MODE DIRECT (bouton 📡 bas droite de la carte, visible
     si le live est actif, clignote 6 s aux demarrages) : alti de la
     journee live (live.py v1.1 : ele + times), curseur HEURE ACTIVE
     orange + sonde jaune ; cycliste anime (pedalage) ou au repos
     (pause > 10 min) dans la fenetre photo ; laptop = alti sous la
     carte, mobile = 2F carte+alti ; tap courbe <-> tap trace = sonde
     croisee avec heure la plus proche ; live OFF/perime = retour auto
     au classique.
     v5.21.0 = (1) echelle temporelle alti AFFINEE : mobile 1j=1h,
     2j=2h, 3-4j=6h, toujours en BAS ; laptop 1j=30min, 2j=1h,
     3-4j=2h, placement dynamique conserve. (2) DESELECTION de la
     date active possible dans l alti (puces) une premiere puce
     touchee bloque l ajout auto de la date photo ; tout
     deselectionner = graphe vide ; reouverture = retour au defaut.
     (3) fond IGN (PLANIGNV2, Geoportail, sans cle) dans le menu 🏔.
     v5.20.0 = AXE TEMPOREL ADAPTATIF dans l alti : 1 journee =
     reperes ~2 h, 2 = ~4 h, 3-4 = ~6 h, 5+ = date JJ/MM seule ;
     placement dynamique haut/bas selon ou vit la courbe ; police
     9 px discrete.
     v5.19.3 = badge km du jour AGRANDI sur laptop/desktop
     (17px + padding renforce ; mobile reste a 12px).
     v5.19.2 = en 3F smartphone, pile de gauche REDUITE (32px :
     ⛰ 🛰 🏔 moins envahissants sur la petite carte) + menu des
     fonds rapproche et compact.
     v5.19.1 = bouton 🏔 = MENU de fonds de carte (plan OSM,
     relief OpenTopoMap, vélo CyclOSM) ; satellite 🛰 reste un
     bouton separe. Ajout facile de nouveaux fonds dans VUES.
     v5.19.0 = BOUTON RELIEF 3D (🏔, pile zoom, a cote de 🛰) : fond
     OpenTopoMap (ombrage du terrain, courbes de niveau, altitudes).
     Le mode de fond passe d un booleen satellite a 3 etats plan/sat/
     topo ; un seul actif a la fois, re-tap = retour au plan.
     v5.18.1 = marqueurs REDUITS sur smartphone en 2F et 1F
     (echelle .75 ; selectionne 1.25 ; le 3F garde ses tailles
     .67/1.1 plus specifiques).
     v5.18.0 = LIENS AMIS TEMPORAIRES : bloc AMIS (code par ami ->
     date d'expiration) juste apres BASE/REPO. Sert au déploiement
     VITRINE (MOP partie 7) : lien ami = .../?ami=<code> ; expire
     -> page remplacee par "lien expire" ; sans code -> accès normal
     (le dépôt données ne bloque jamais). Revocation avant terme =
     retirer la ligne + push.
     v5.17.1 = BADGE KM du jour : a droite du selecteur de date, la
     distance de la journee active. Source : profil.json "km" (calcule
     par build_daily v5.2.27 sur les points NON decimes - garmin 1/s
     = precision maximale) ; secours : trace.geojson (datee) ; journee
     live non publiee : distance de live_trace (gpslogger, evolue en
     direct au fil du poll 30 s). profil.json est charge au boot
     (independamment du panneau alti).
     v5.17.0 = POSITIONNEMENT LIVE : pendant la journee, live.py
     (Telephone, toutes les 2 min) pousse live.json + live_trace.geojson
     depuis l'enregistrement gpslogger (1 pt/min). La galerie POLL le
     fichier toutes les 30 s (cache-busting) : marqueur PULSANT orange
     a la derniere position + trace partielle du jour en pointilles
     gris. Signal de plus de 10 min -> marqueur gris "en pause" ;
     live.json date d'un AUTRE jour (ou absent) -> rien n'est affiche.
     Le soir, la routine ecrase la trace du jour par GARMIN (priorite
     existante) : live.json devient perime et le live disparait seul.
     Pas d'impact uMap (choix utilisateur : galerie seulement).
     v5.16.32 = ALTIMETRIE VIDE / jour absent : profil.json etait
     charge SANS cache-busting (contrairement a photos.csv?v=...) -
     le navigateur servait un profil PERIME depuis le cache HTTP :
     le jour courant manquait dans la liste des dates et le graphe
     restait vide (l'alti auto-selectionne la journee de la photo
     affichee). Meme correctif : ?v=Date.now().
     v5.16.31 = (2F photo+alti) PHOTO PAYSAGE A 100 % : a 40 %,
     l'alti laissait le paysage TRES LEGEREMENT TRONQUE (ratio 4:3).
     On calcule la hauteur EXACTE qu'exige la photo courante pleine
     largeur (barre + commentaire deduits) et on la PREND SUR
     L'ALTI (plancher 22 % ecran) : paysage entier, sans badge ;
     portrait : badge "glisser" conserve. Le reste est inchange
     (geometrie deterministe v5.16.30, poignee ⌄ masquee).
     v5.16.30 = geometrie deterministe (alti 40 % ecran, photo = reste).
     v5.16.28 = espace restant (ABANDONNE - fenetre = 1/3 mwH).
     v5.16.27 = filet image en cache + enablePan idempotent.
     v5.16.26 = toutes les photos PLEINE LARGEUR (badge "glisser").
     v5.16.25 = fenetre photo epinglee en px (40 %) + poignee ⌄ masquee.
     v5.16.24 = barre du haut fixe en 2F alti + retrait traceur.
     v5.16.23 = alti reduite d'un tiers + tracé final garanti.
     Synthese serie : alti 2F = 2/3 ancree en bas, seuil 20 px +
     filet settle 800 ms, rotation immediate, tracé nav borne.
     v5.16.22 = seuil 20 px (micro-paliers de 4 px ignores).
     v5.16.21 = delai 1000 ms (insuffisant : cadences variables).
     v5.16.20 = rotation immediate / hauteur differee (regle largeur).
     v5.16.19 = tracé de navigation borne a la hauteur VISIBLE.
     v5.16.18 = debounce 400 ms (paliers ~140 ms absorbes).
     v5.16.17 = badge enrichi (em, dates, sources).
     v5.16.16 = debounce unifie resize + ResizeObserver (120 ms).
     v5.16.15 = debounce du ResizeObserver (rafales [obs] identifiées).
     v5.16.14 = version diagnostic (badge orange).
     v5.16.13 = drawProfil(false) : contenu seul au defilement.
     v5.16.12 = cle de cache limitee aux classes de mode.
     v5.16.11 = geometrie memorisee par mode (stabilite defilement).
     v5.16.10 = #mapwrap flex-column en .alti (fix mini-alti).
     v5.16.9 = plus aucune hauteur px en 2F alti (flex:1 gouverne).
     v5.16.8 = mesure getBoundingClientRect + borne haute du SVG.
     v5.16.7 = SVG en pixels explicites, borne par le bas du conteneur.
     v5.16.6 = hauteur panneau recalculee par drawProfil a chaque trace.
     v5.16.5 = CRITIQUE : fix TDZ render()/profilOn (page vide).
     v5.16.4 = cadrage zone visible + hauteur alti en pixels.
     v5.16.3 = purge du graphe SVG a la fermeture.
     v5.16.2 = redessin differe (rAF + 150 ms) + ResizeObserver panneau.
     v5.16.1 = boutons ⇅/⧉ alti 1F en z-index 1600.
     v5.16 = (1) ouverture smartphone : mode "3 FENETRES" par defaut
     (photo+carte+alti, comme si ⛰ de la carte etait active) ;
     (2) en 3F : carte RECENTREE sur la photo affichee + marqueurs
     reduits d'1/3 (2F photo+carte inchange) ; (3) monofenetre alti :
     bouton retour ⇅ (manquant) ; (4) butee ZMAX 18->16 (anti "page
     bleue" a zoom max) ; (5) bouton 🛰 vue SATELLITE (tuiles Esri
     World Imagery) sur smartphone ET laptop.
     v5.15.12 = grille dates alti 4 lignes (ouverture 6 s, poignee 7 s).
     v5.15.10 = la DATE ALTI SUIT la date PHOTO : changer la journee
     via le menu du haut passiverise l'ancienne date auto dans l'alti
     et active la nouvelle (selection = puces cochees a la main U
     date de la photo affichee) ; les puces cochees manuellement ne
     sont JAMAIS desactivees automatiquement.
     v5.15.9 = en 2F photo+ALTI, fenetre alti 60% de hauteur.
     v5.15.8 = poignee ⌄ des dates alti : affichage 4 s (2500 ms
     avant : trop court pour cocher plusieurs dates).
     v5.15.7 = temporisations 1 s (barre du haut ET puces dates de
     l'alti, rappel poignee = 2,5 s) ; poignee ⌄ AJOUTEE dans la
     fenetre altimetrie pour selectionner les dates ; poignee de la
     barre du haut DEPLACEE vers le haut de la PHOTO (avant : carte).
     v5.15.6 = barre flottante en 2F (normal + 3 fenetres), puces
     flottantes sur l'alti, photo conservee apres fermeture ✕.
     v5.15.5 = la PHOTO RESTE AFFICHEE en mode "3 fenetres".
     v5.15.4 = barre temporaire + bouton ✕ + alti 40%.
     v5.15.3 = MODE "3 FENETRES" (2F photo+carte + ⛰ de la carte) :
     photo masquee, barre du haut flottante translucide (survol
     temporaire par-dessus la carte), carte+alti occupent tout
     l'ecran, alti agrandie a 45% -> plus de troncature en bas.
     v5.15.2 = FIX : bouton ⧉ (retour 2 fenetres) visible en alti
     plein ecran 1F - c'etait le seul ecran d'ou l'on ne pouvait
     PAS revenir en double fenetre.
     v5.15.1 = FIX MOBILE : (1) altimetrie en OVERLAY sur la carte
     (2F photo+carte + ⛰) : puces de dates masquees -> le graphe
     n'est plus tronque en bas ; (2) bouton ⛰ de la pile reduit
     (40px) sur smartphone.
     v5.15 = VUES ALTIMETRIE MOBILES (bouton ⛰ dans l'entete) :
     - 1 fenetre : ⛰ = altimetrie PLEIN ECRAN (retour photo par ⇅)
     - 2 fenetres : ⛰ = bas de panneau passe de la CARTE a l'ALTI
       (et inversement) -> combos photo+carte / photo+alti ; la vue
     carte+alti reste accessible en 1F carte (⛰ de la pile zoom =
     overlay 35% comme avant).
     v5.14.2 = FIX curseur altimetrie : l'heure des photos (nom de
     fichier, heure locale) etait lue en UTC -> decalage +2h (ete) :
     curseur trop a droite en debut de journee, invisible sur les 2
     dernieres heures. Aussi : photo hors trace (avant allumage GPS /
     apres extinction) -> curseur aux bornes de la journee la plus
     proche, au lieu de disparaitre.
     v5.14.1 = FIX altimetrie : (1) journees mises bout a bout sur un
     axe virtuel -> les nuits ne creent plus d'espaces vides entre les
     courbes (separateur pointille discret entre journees) ; (2) le
     bouton ⛰ reste visible sur smartphone (zoom +/- toujours retires).
     v5.14 = ALTIMETRIE : bouton ⛰ (stack zoom) -> panneau bas de carte
     (~35%), multi-dates par puces, axe Y dynamique, curseur vertical
     a l'heure de la photo affichee, clic inverse profil -> photo.
     Donnees : profil.json genere par build_daily/gerer (v5.2.25).
     v5.13 = PORTRAIT PANORAMABLE : miniatures portraits non recadrees
     (etape1 v5.7, 600 x H), affichees pleine largeur dans le cadre fixe
     avec defilement vertical a la petite main (enablePan).
     v5.12 = FIX chevron DEFINITIF : le fond orange est sur .selbox (la
     boite), le select devient transparent dedans - le chevron est dans
     le bouton par construction, aucun rendu natif ne peut l'exiler
     (v5.10/v5.11 calaient le ▾ sur une boite dont le select natif
     divergeait legèrement selon navigateur/zoom). -->
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Journal vélo — Galerie</title>
<style>
  html,body{margin:0;height:100%;font-family:system-ui,Segoe UI,sans-serif;background:#0b0e13;color:#eee;overflow:hidden}
  #wrap{display:flex;height:100%;width:100%;position:relative}
  /* --- partie 1 : galerie (gauche) --- */
  #side{flex:0 0 var(--side-w,340px);background:#11151d;border-right:1px solid #39445c;display:flex;flex-direction:column;min-width:0}
  #side .sh{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid #26304a}
  #side .sh .t{font-size:15px;font-weight:600;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  /* poignee de redimensionnement galerie <-> carte (glisse lateral) */
  #split{flex:0 0 10px;cursor:col-resize;background:#1c2230;border-left:1px solid #39445c;border-right:1px solid #39445c;touch-action:none}
  #split:hover,#split.on{background:#ff7a00}
  #media{background:#000;display:flex;align-items:center;justify-content:center;flex:1;min-height:0;position:relative;touch-action:none;overflow:hidden}
  #media img,#media video{max-width:100%;max-height:100%;display:block}
  /* v5.13 : photo PORTRAIT - affichee PLEINE LARGEUR dans le cadre
     fixe (hauteur libre > cadre), defilement vertical a la petite main */
  #media img.tall{max-height:none;width:100%;height:auto;position:absolute;top:0;left:0;cursor:grab;touch-action:none;user-select:none;-webkit-user-drag:none}
  #media img.tall.drag{cursor:grabbing}
  /* v5.13.1 : indice VISUEL de glissement (le cursor grab est invisible
     sur ecran tactile) - badge main + doubles fleches, pulse, disparait
     au premier glissement (classe .off) ou apres 5 s. */
  #panHint{position:absolute;right:14px;bottom:14px;z-index:5;display:flex;align-items:center;gap:6px;padding:8px 12px;border-radius:22px;background:rgba(0,0,0,.55);color:#fff;font-size:22px;line-height:1;pointer-events:none;animation:panPulse 1.6s ease-in-out infinite;transition:opacity .4s}
  #panHint.off{opacity:0;animation:none}
  @keyframes panPulse{0%,100%{transform:translateY(0);opacity:.95}50%{transform:translateY(-7px);opacity:.65}}
  #cap{padding:9px 12px;font-size:13px;color:#c8d2e0;border-top:1px solid #26304a}
  #cap .nm{font-weight:600;color:#eef2f8;margin-bottom:3px;word-wrap:break-word}
  #cap .dt{opacity:.75}
  /* commentaire mis en evidence : bloc distinct, plus grand, lisible */
  #cmt{display:none;margin-top:6px;padding:8px 11px;background:#1c2740;border-left:4px solid #ff7a00;border-radius:0 8px 8px 0;font-size:15.5px;line-height:1.45;color:#ffe9c9;word-wrap:break-word}
  #cmt.on{display:block}
  #cmt{max-height:5.2em;overflow-y:auto}   /* meme sur laptop : un long commentaire ne mange pas la photo */
  /* --- partie 2 : carte (droite) --- */
  #mapwrap{flex:1;position:relative;min-width:0}
  #map{position:absolute;inset:0;overflow:hidden;background:#a9c6d8;cursor:grab;touch-action:none}
  #map.drag{cursor:grabbing}
  #world{position:absolute;left:0;top:0;width:0;height:0}
  .tile{position:absolute;width:256px;height:256px;border:none}
  #traces{position:absolute;left:0;top:0;overflow:visible;pointer-events:none}
  /* v5.22.4 : le calque de la trace LIVE (id renomme "tracelive" en
     v5.22.2) n'avait PLUS ce positionnement -> SVG taille nulle,
     pointille invisible malgre des donnees valides (cas reel :
     tr:1 pts:9 mais rien sur la carte). */
  #tracelive{position:absolute;left:0;top:0;overflow:visible;pointer-events:none}
  /* v5.17 : marqueur LIVE pulsant (position gpslogger du jour) */
  .mklive{position:absolute;width:18px;height:18px;margin:-9px 0 0 -9px;border-radius:50%;background:#e63946;border:2.5px solid #fff;animation:livepulse 2s infinite;pointer-events:none;z-index:5}
  .mklive.pause{background:#8a8f98;animation:none}
  @keyframes livepulse{0%{box-shadow:0 0 0 0 rgba(255,122,0,.7)}70%{box-shadow:0 0 0 16px rgba(255,122,0,0)}100%{box-shadow:0 0 0 0 rgba(255,122,0,0)}}
  .mk{position:absolute;transform:translate(-50%,-100%);cursor:pointer;line-height:0}
  .mk .icon{display:block;transition:transform .18s ease;transform-origin:50% 100%;filter:drop-shadow(0 1px 2px rgba(0,0,0,.5))}
  .mk.sel .icon{transform:scale(1.65);filter:drop-shadow(0 0 0 #fff) drop-shadow(0 0 6px #fff) drop-shadow(0 2px 3px rgba(0,0,0,.6))}
  .mk.sel{z-index:500}
  /* --- contrôles --- */
  #zoom{position:absolute;left:10px;top:10px;display:flex;flex-direction:column;gap:8px;z-index:1000}
    #zoom button{width:52px;height:52px;font-size:26px;font-weight:700;border-radius:12px;border:2px solid #b35300;background:#ff7a00;color:#fff;cursor:pointer;box-shadow:0 3px 8px rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center}
  #zoom button:hover{background:#ffa040}
  #zoom button:active{background:#cc6200}
  /* v5.14 : bouton altimetrie (dans la pile #zoom) + panneau profil */
  #zoom button.on{background:#1f77e5;border-color:#123c6e}
  /* v5.19.1 : menu de choix du fond de carte (bouton 🏔) */
  #vueMenu{display:none;position:absolute;left:70px;top:10px;z-index:1200;flex-direction:column;gap:6px}
  #vueMenu.open{display:flex}
  #vueMenu button{display:flex;align-items:center;gap:8px;padding:10px 14px;border-radius:10px;border:1px solid #45526b;background:#1c2230ee;color:#eee;font-size:14px;cursor:pointer;backdrop-filter:blur(4px);box-shadow:0 3px 8px rgba(0,0,0,.45);white-space:nowrap}
  #vueMenu button:hover{background:#2a3245}
  #vueMenu button.on{background:#1f77e5;border-color:#123c6e}
  #profil{position:absolute;left:0;right:0;bottom:0;height:35%;background:#0d1117f2;border-top:2px solid #39445c;z-index:1002;display:none;flex-direction:column}
  #profil.on{display:flex}
  #prChips{display:flex;gap:6px;overflow-x:auto;padding:6px 8px;flex:0 0 auto;scrollbar-width:thin}
  .prChip{padding:4px 10px;border-radius:14px;background:#1c2230;border:1px solid #45526b;color:#eee;font-size:12px;cursor:pointer;white-space:nowrap;flex:0 0 auto}
  /* v5.17.1 : badge km de la journee active (droite du selecteur de date) */
  #kmDay{padding:4px 10px;border-radius:14px;background:#1c2230;border:1px solid #45526b;color:#ffd60a;font-size:12px;font-weight:700;white-space:nowrap;flex:0 0 auto}
  #kmDay:empty{display:none}
  /* v5.19.3 : badge km AGRANDI sur laptop/desktop (17px = taille
     des boutons de la barre du haut + 2px) ; mobile garde 12px. */
  @media (min-width:821px){#kmDay{font-size:17px;padding:5px 12px}}
  .prChip.on{background:#ff7a00;border-color:#b35300;font-weight:700}
  #prWrap{flex:1;position:relative;margin:0 8px 8px}
  #prSvg{width:100%;height:100%;display:block}
  #bar{position:absolute;top:10px;right:10px;display:flex;gap:8px;z-index:1000}
  #bar button{padding:9px 13px;border-radius:9px;border:1px solid #45526b;background:#1c2230ee;color:#eee;font-size:14px;cursor:pointer;backdrop-filter:blur(4px)}
  #bar button:hover{background:#2a3245}
  #bar button.on{background:#2d6a4f;border-color:#40916c}
  #bar a{padding:16px 24px;border-radius:12px;border:2px solid #2f6db3;background:#1b3a63ee;color:#fff;font-size:20px;font-weight:700;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:8px;backdrop-filter:blur(4px);box-shadow:0 3px 8px rgba(0,0,0,.45)}
  #bar a:hover{background:#255089}
  /* v5.22 : bouton MODE DIRECT (bas droite de la carte) - visible
     des que le live est valide ; clignote 6 s aux (re)demarrages
     du deplacement ; actif (vert) en mode direct. */
  #btLive{position:absolute;right:10px;bottom:10px;z-index:1100;display:none;align-items:center;gap:6px;padding:9px 13px;border-radius:10px;border:1px solid #40916c;background:#2d6a4fee;color:#fff;font-size:14px;font-weight:700;cursor:pointer;backdrop-filter:blur(4px);box-shadow:0 3px 8px rgba(0,0,0,.45)}
  #btLive:hover{background:#3a7f62}
  #btLive.on{background:#ff7a00;border-color:#b35300}
  #btLive.blink{animation:liveblink .7s steps(2,start) 9}
  @keyframes liveblink{50%{opacity:.2}}
  /* v5.22 : sonde live (point tape sur la trace/courbe) + cycliste */
  #mkprobe{position:absolute;z-index:600;transform:translate(-50%,-100%);text-align:center;line-height:1}
  #mkprobe .d{width:12px;height:12px;border-radius:50%;background:#ffd60a;border:2px solid #fff;margin:0 auto;box-shadow:0 1px 3px rgba(0,0,0,.5)}

  .nav{flex:0 0 64px;height:56px;font-size:28px;font-weight:700;background:#ff7a00;border:2px solid #b35300;color:#fff;cursor:pointer;border-radius:10px;box-shadow:0 3px 8px rgba(0,0,0,.45)}

  /* =========== ADAPTATION SMARTPHONE ===========

     de base (#zoom, select.nav, #bar a...), elle etait systematiquement

    #zoom #btProfil,#zoom #btSat,#zoom #btTopo{width:40px;height:40px;font-size:19px}

    /* v5.16.24 (demande utilisateur) : en 2F photo+alti, la barre du

    #wrap:not(.single) #side .sh.show{opacity:1;pointer-events:auto}
    /* v5.15.7 : poignee ⌄ des DATES de l'alti - meme principe que

    #prHandle{display:none}

    #side{position:relative}

    /* v5.16.25 : en 2F photo+alti, la barre du haut est FIXE -> la

    /* v5.15.6 : puces de DATES de l'alti = aussi FLOTTANTES (par-dessus

       graphe garde toute sa hauteur, plus de troncature */
    /* v5.15.12 : puces en GRILLE 4 LIGNES x colonnes de 4 dates

    #profil.on #prChips{position:absolute;top:0;left:0;right:0;z-index:5;background:#0d1117f2;opacity:0;pointer-events:none;transition:opacity .25s;display:grid;grid-auto-flow:column;grid-template-rows:repeat(4,auto);grid-auto-columns:max-content;align-content:start;gap:4px;padding:8px;overflow-x:auto;max-height:148px}
    #profil.on #prChips.show{opacity:1;pointer-events:auto}
    /* bouton FERMER l'alti (en haut a droite de l'alti) */
    #prClose{display:none}
    #wrap.p3 #prClose{display:flex;position:absolute;top:6px;right:8px;z-index:1600;width:36px;height:36px;border-radius:10px;border:2px solid #b35300;background:#ff7a00;color:#fff;font-size:17px;font-weight:700;align-items:center;justify-content:center;cursor:pointer}
    #wrap.p3 #profil{height:40%}

    .mk .icon{transform:scale(.75)}

    #wrap.p3.direct #side{display:none}

    /* l'URL/nom de fichier n'apporte rien sur mobile : date deja dans

    #cap .nm,#cap .dt{display:none}
    .selbox{width:124px;height:40px}

    #cmt{font-size:13.5px;max-height:3.4em}
    #admBox button{height:38px;font-size:14px}
    /* boutons d'entete photo (mobile seulement) : bascule carte + layout */

    #wrap:not(.single) #hdFlip{display:none}

    #wrap:not(.single) #btLayoutM{display:none}
    /* bouton layout 2-fenetres, sur la carte (mobile seulement) */
    #btLayoutM{display:flex;position:absolute;left:64px;bottom:14px;z-index:1001;width:46px;height:46px;border-radius:12px;border:2px solid #b35300;background:#ff7a00cc;color:#fff;font-size:18px;align-items:center;justify-content:center;cursor:pointer;backdrop-filter:blur(3px)}

  }
  #admBox textarea{background:#0d1117;color:#eee;border:1px solid #45526b;border-radius:8px;padding:8px;font-family:inherit;font-size:13px;resize:vertical;min-height:44px}

<script>
"use strict";
// --- Seule ligne a adapter : l'URL GitHub Pages du projet ---
const BASE = "https://gurtsepaqrt87.github.io/gkr63x-g84zwo";
// --- 2e ligne a adapter (mode admin) : le depot GitHub "user/projet".
// NB : non deduisible de BASE (sur user.github.io/projet, l'user est
// dans le sous-domaine, pas dans le chemin) - d'ou cette constante.
const REPO = "gurtsepaqrt87/gkr63x-g84zwo";
// --- v5.18 : liens amis temporaires (déploiement VITRINE) ---
// Un code par ami + date d'expiration ISO. Le lien ami :
//   https://<user>.github.io/<vitrine>/?ami=<code>
// - code absent ou inconnu -> accès NORMAL (lien famille permanent ;
//   aussi le cas du dépôt données, qui ne doit RIEN bloquer).
// - code valide -> accès jusqu'à sa date (23:59:59).
// - code expiré -> la page est remplacee par "lien expire".
// Revoquer avant terme : retirer la ligne + push vitrine (~1 min).
// NB honnete : la table est lisible dans le source ; la protection
// REELLE reste la rotation du dépôt données (MOP partie 7 §4).
const AMIS = {
  // "exemple": "2026-12-31",   // <- 1 ligne par ami, code arbitraire
"vis1": "2026-12-31",
"vis2": "2026-11-30"
};
if (location.search.includes("ami=")) {
  const q = new URLSearchParams(location.search).get("ami");
  const exp = q && AMIS[q];
  if (exp && new Date() > new Date(exp + "T23:59:59")) {
    document.body.innerHTML =
      "<p style='padding:40px;font-size:20px;font-family:sans-serif'>" +
      "Lien expiré — demandez un lien à jour à Alain.</p>";
    throw new Error("expired");
  }
}

const mapEl = document.getElementById("map");
const world = document.getElementById("world");
const side = document.getElementById("side");
const mediaEl = document.getElementById("media");
const capTxt = document.getElementById("capTxt");
const capDate = document.getElementById("capDate");
const cntEl = document.getElementById("cnt");
const errEl = document.getElementById("err");

let zoom = 11, clon = -1.85, clat = 48.15;   // centre initial (cadrage auto ensuite)
let ox = 0, oy = 0;
let media = [], marks = [], traces = [];
// v5.17 : live (position gpslogger du jour, poussee par live.py)
let live = null, liveTrace = [], liveEl = null;
// v5.17.1 : km par journee (profil.json "km", charge au boot)
let kmData = null;
let sel = -1, userResized = false;   // userResized : l'utilisateur a glisse la poignee -> plus d'ajustement auto
const ZMIN = 3, ZMAX = 16;   // v5.16 : ZMAX 18->16, butee anti "page
                             // bleue" (au-dela de 16, tuiles vides/ocean)
// ---------- contexte d'affichage : laptop OU smartphone ----------
// "pointer:coarse" = doigt (pas souris) ; petit ecran en plus = mobile.
// Sert a desactiver l'ajustement auto de largeur (sans objet en portrait)
// et a afficher l'aide gestuelle. La bascule horizontal/vertical est
// geree par les media queries CSS (layout) + le resize (rendu carte).
const MOBILE = matchMedia("(pointer: coarse)").matches || innerWidth < 820;
// galerie <= 2/3 de l'axe disponible (largeur en paysage, hauteur en portrait)
function SIDEMAX() {
  const col = getComputedStyle(document.getElementById("wrap"))
    .flexDirection.includes("column");
  return Math.floor((col ? innerHeight : innerWidth) * 2 / 3);
}
function setSideW(px) {
  // Largeur MINIMALE de la fenetre photos : l'en-tete doit toujours tenir
  // (‹ 64 + date 128 + compteur ~50 + › 64 + marges ~30 ≈ 340 px). Sans
  // ce plancher, une video basse resolution en portrait (ex. celle du
  // 28/09) reduisait la fenetre sous cette valeur -> bouton date ampute.
  const SIDEMIN = 348;
  side.style.setProperty("--side-w", Math.max(SIDEMIN, Math.min(SIDEMAX(), px)) + "px");
}

// ---------- projection ----------
const scale = z => 256 * Math.pow(2, z);
const lon2x = (lon, z) => (lon + 180) / 360 * scale(z);
const lat2y = (lat, z) => {
  const s = Math.sin(lat * Math.PI / 180);
  return (0.5 - Math.log((1 + s) / (1 - s)) / (4 * Math.PI)) * scale(z);
};
function px2lon(px) { return px / scale(zoom) * 360 - 180; }
function py2lat(py) {
  const n = Math.PI - 2 * Math.PI * py / scale(zoom);
  return 180 / Math.PI * Math.atan(0.5 * (Math.exp(n) - Math.exp(-n)));
}

// ---------- tuiles ----------
const tiles = new Map();
// v5.19 : mode de fond de carte - "plan" (OSM), "sat" (Esri) ou
// "topo" (OpenTopoMap : ombrage du terrain, courbes de niveau,
// altitudes - la vue "relief 3D"). Un seul mode actif a la fois.
let vue = "plan";
// v5.19.1 : fonds disponibles. OpenTopoMap et CyclOSM sont servis
// sur 3 sous-domaines (a/b/c) - rotation pour repartir la charge,
// meme pratique que les tuiliers OSM. Tous en z/x/y standard.
const VUES = {
  plan:  { nom: "Plan",    url: k => "https://tile.openstreetmap.org/" + k + ".png" },
  topo:  { nom: "Relief",  sub: ["a", "b", "c"],
           url: (k, s) => "https://" + s + ".tile.opentopomap.org/" + k + ".png" },
  cyclo: { nom: "Vélo",    sub: ["a", "b", "c"],
           url: (k, s) => "https://" + s + ".tile-cyclosm.openstreetmap.fr/cyclosm/" + k + ".png" },
  // v5.21 : IGN - plan IGN v2 (Géoportail, libre d'acces, sans cle).
  // WMTS : ordre par parametres (z=TILEMATRIX, x=TILECOL, y=TILEROW),
  // pas par chemin comme OSM. Zoom max 19.
  ign:   { nom: "IGN",     url: k => {
            const p = k.split("/");
            return "https://data.geopf.fr/wmts?SERVICE=WMTS&VERSION=1.0.0"
                 + "&REQUEST=GetTile&LAYER=GEOGRAPHICALGRIDSYSTEMS.PLANIGNV2"
                 + "&STYLE=normal&FORMAT=image%2Fpng&TILEMATRIXSET=PM"
                 + "&TILEMATRIX=" + p[0] + "&TILEROW=" + p[2] + "&TILECOL=" + p[1];
          } },
};
function setVue(v) {
  vue = v;
  document.getElementById("btSat").classList.toggle("on", vue === "sat");
  document.getElementById("btTopo").classList.toggle("on", vue !== "plan" && vue !== "sat");
  document.querySelectorAll("#vueMenu button").forEach(b =>
    b.classList.toggle("on", b.dataset.vue === vue));
  document.getElementById("vueMenu").classList.remove("open");
  tiles.forEach(img => img.remove());   // vider le cache : autres tuiles
  tiles.clear();
  render();
}
function renderTiles() {
  const W = mapEl.clientWidth, H = mapEl.clientHeight;
  const x0 = Math.floor(ox / 256), y0 = Math.floor(oy / 256);
  const x1 = Math.floor((ox + W) / 256), y1 = Math.floor((oy + H) / 256);
  const max = scale(zoom) / 256;
  for (let x = x0; x <= x1; x++) for (let y = y0; y <= y1; y++) {
    if (y < 0 || y >= max) continue;
    const wx = ((x % max) + max) % max;
    const key = zoom + "/" + wx + "/" + y;
    if (tiles.has(key)) continue;
    const img = document.createElement("img");
    img.className = "tile";
    // v5.19.1 : fond selon VUES (plan OSM / relief OpenTopoMap / vélo
    // CyclOSM, via le menu 🏔) ou satellite Esri (bouton 🛰, a part).
    // Esri : /tile/{z}/{y}/{x} (y AVANT x, contrairement a OSM).
    if (vue === "sat") {
      const p = key.split("/");
      img.src = "https://server.arcgisonline.com/ArcGIS/rest/services/"
              + "World_Imagery/MapServer/tile/" + p[0] + "/" + p[2] + "/" + p[1];
    } else {
      const V = VUES[vue] || VUES.plan;
      // sous-domaine a/b/c reparti par tuile (equilibre de charge)
      img.src = V.sub ? V.url(key, V.sub[(x + y) % 3])
                      : V.url(key);
    }
    img.style.left = (x * 256) + "px";
    img.style.top = (y * 256) + "px";
    img.draggable = false;
    world.appendChild(img);
    tiles.set(key, img);
  }
}

// ---------- traces ----------
let svg = null;
function renderTraces() {
  if (svg) { svg.remove(); svg = null; }
  if (!traces.length) return;
  svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
  svg.id = "traces";
  // v5.23 : PRECISION SVG - les coordonnees etaient en pixels MONDE
  // absolus (~8 M px au zoom 16) : les rasteriseurs perdent la
  // precision a ces echelles et le tracé S'EFFACE au fort zoom
  // (bug reel : "tous les tracés disparaissent proche du zoom max").
  // Parade (facon Leaflet) : coordonnees RELATIVES a la fenetre
  // visible (quelques milliers de px), SVG positionne a (ox,oy) et
  // dimensionne a la fenetre.
  svg.style.left = ox + "px"; svg.style.top = oy + "px";
  svg.style.width = mapEl.clientWidth + "px";
  svg.style.height = mapEl.clientHeight + "px";
  for (const t of traces) {
    if (t.geometry.coordinates.length < 2) continue;
    const pts = t.geometry.coordinates
      .map(c => (lon2x(c[0], zoom) - ox) + "," + (lat2y(c[1], zoom) - oy))
      .join(" ");
    const p = document.createElementNS("http://www.w3.org/2000/svg", "polyline");
    p.setAttribute("points", pts);
    const o = t.properties._umap_options || {};
    p.setAttribute("fill", "none");
    p.setAttribute("stroke", o.color || "#3388ff");
    p.setAttribute("stroke-width", o.weight || 4);
    p.setAttribute("stroke-opacity", o.opacity || 0.8);
    p.setAttribute("stroke-linecap", "round");
    p.setAttribute("stroke-linejoin", "round");
    svg.appendChild(p);
  }
  world.appendChild(svg);
}

// ---------- v5.17.1 : badge km de la journee active ----------
function havKm(coords) {
  let d = 0;
  for (let i = 1; i < coords.length; i++) {
    const dlat = (coords[i][1] - coords[i - 1][1]) * 0.0174533;
    const dlon = (coords[i][0] - coords[i - 1][0]) * 0.0174533;
    const mlat = (coords[i][1] + coords[i - 1][1]) / 2 * 0.0174533;
    d += 6371 * Math.sqrt(dlat * dlat + Math.pow(dlon * Math.cos(mlat), 2));
  }
  return d;
}
function updateKmDay() {
  const el = document.getElementById("kmDay");
  if (!el) return;
  // v5.23 : MODE DIRECT -> km LIVE approximatif (trace live, points
  // a 1/min : la vraie distance est celle du soir, Garmin) ; le ">"
  // signale l'approximation.
  if (liveMode) {
    let t = 0;
    for (const f of liveTrace) t += havKm(f.geometry.coordinates || []);
    el.textContent = t > 0
      ? "> " + String(t < 10 ? t.toFixed(1) : Math.round(t)).replace(".", ",") + " km"
      : "";
    return;
  }
  const d = media[sel] ? media[sel].date : null;
  if (!d) { el.textContent = ""; return; }
  // 1) profil.json "km" (points NON decimes - garmin 1/s : precis)
  let km = (kmData && kmData[d] != null) ? kmData[d] : null;
  // 2) secours : trace.geojson datee (points decimes - anciens profil)
  if (km == null) {
    let t = 0;
    for (const f of traces)
      if ((f.properties || {}).date === d) t += havKm(f.geometry.coordinates || []);
    if (t > 0) km = t;
  }
  // 3) journee live pas encore publiee : distance de la trace live
  if (km == null && live && live.date === d && liveTrace.length) {
    let t = 0;
    for (const f of liveTrace) t += havKm(f.geometry.coordinates || []);
    km = t;
  }
  el.textContent = km == null ? "" :
    String(km < 10 ? km.toFixed(1) : Math.round(km)).replace(".", ",") + " km";
}

// ---------- v5.17 : positionnement LIVE ----------
function liveValid() {
  // affiche seulement si : donnee du JOUR, signal de moins de 30 min
  if (!live) return false;
  if (live.date !== new Date().toISOString().slice(0, 10)) return false;
  return (Date.now() / 1000 - live.t) < 1800;
}
function renderLive() {
  if (liveEl) { liveEl.remove(); liveEl = null; }
  if (!liveValid()) return;
  liveEl = document.createElement("div");
  liveEl.className = "mklive" + ((Date.now() / 1000 - live.t) > 600 ? " pause" : "");
  const d = new Date(live.t * 1000);
  liveEl.title = "En direct — dernier signal " +
    String(d.getHours()).padStart(2, "0") + ":" + String(d.getMinutes()).padStart(2, "0");
  liveEl.style.left = lon2x(live.lon, zoom) + "px";
  liveEl.style.top = lat2y(live.lat, zoom) + "px";
  world.appendChild(liveEl);
}
async function pollLive() {
  try {
    const j = await (await fetch(BASE + "/live.json?v=" + Date.now())).json();
    const changed = !live || j.t !== live.t || (j.n || 0) !== (live.n || 0);
    live = j;
    // v5.22.3 : la trace est (re)chargee si live.json change OU si on
    // n'en a PAS ENCORE une (le chargement unique d'avant restait
    // vide a vie des qu'un fetch echouait une fois - curseur OK mais
    // pointille/alti morts : cas reel diagnostique en console,
    // liveTrace.length=0 avec live.json sain).
    if (changed || !liveTrace.length) {
      try {
        const g = await (await fetch(BASE + "/live_trace.geojson?v=" + Date.now())).json();
        liveTrace = g.features || [];
        // v5.22.2 : ne plus avaler les anomalies silencieusement.
        if (!g.features) console.warn("live_trace.geojson: pas de features", g);
      } catch (e) { liveTrace = [];
        console.warn("live_trace.geojson: echec chargement", e); }
      parseLivePts();                   // v5.22 : mode direct
      render();
      if (liveMode) {
        // v5.22.1 : SUIVI - chaque nouveau point recentre la carte sur
        // la position live (le pan manuel est repris au signal suivant,
        // <= 2 min : c'est le but du suivi en direct).
        if (liveMoving()) { clon = live.lon; clat = live.lat; render(); }
        drawProfil(); showCyclist(); renderLiveProbe();
      }
    } else { renderLive(); }
    updLiveBtn();                       // v5.22 : bouton/clignotement/exit auto
  } catch (e) { /* live.json absent (feature OFF ou jamais poussee) */
    updLiveBtn(); }
}

// ---------- v5.22 : MODE DIRECT (live <> classique) ----------
let liveMode = false, livePts = [], liveProbe = null, probeEl = null, liveWasMov = false;
function liveMoving() { return liveValid() && (Date.now() / 1000 - live.t) < 600; }
function fmtH(t) {                      // epoch s -> "HH:MM"
  const d = new Date(t * 1000);
  return String(d.getHours()).padStart(2, "0") + ":" + String(d.getMinutes()).padStart(2, "0");
}
function parseLivePts() {              // v1.1 de live.py : 3D + times
  livePts = [];
  for (const f of liveTrace) {
    const cs = f.geometry.coordinates || [], ts = (f.properties || {}).times || [];
    for (let i = 0; i < cs.length; i++)
      livePts.push({ lon: cs[i][0], lat: cs[i][1],
                     ele: cs[i][2] != null ? cs[i][2] : null,
                     t: ts[i] || live.t });
  }
  livePts.sort((a, b) => a.t - b.t);
}
function updLiveBtn() {
  const b = document.getElementById("btLive");
  const ok = liveValid();
  b.style.display = ok ? "flex" : "none";
  b.classList.toggle("on", liveMode);
  const mov = liveMoving();
  // clignote 6 s a chaque (re)demarrage du deplacement (apres pause)
  if (ok && mov && !liveWasMov) {
    b.classList.add("blink");
    setTimeout(() => b.classList.remove("blink"), 6300);
  }
  if (!mov) b.classList.remove("blink");
  liveWasMov = mov;
  // live coupe (widget OFF) ou perime -> retour automatique au classique
  if (!ok && liveMode) exitLive();
}
async function enterLive() {
  liveMode = true; liveProbe = null;
  await openProfil();                  // laptop : alti sous la carte ; mobile : p3 carte+alti
  wrapEl.classList.add("direct");      // v5.22.1 : mobile -> photo masquee (2F carte+alti)
  prManual = new Set([live.date]);     // le graphe ne trace QUE la journee live
  prTouched = true;
  syncPrDates(); drawProfil();
  showCyclist();
  // v5.22.1 : la carte se CENTRE sur la position live (openProfil vient
  // de la centrer sur la photo active - ancienne journee, hors trajet)
  clon = live.lon; clat = live.lat; render();
  renderLiveProbe();
  // v5.23 : "📡 Direct" dans le selecteur de dates + km live dans le
  // badge ("> xx km" : approximatif, granularite 1 pt/min)
  const dSel = document.getElementById("btDate");
  if (![...dSel.options].some(o => o.value === "__live__")) {
    const o = document.createElement("option");
    o.value = "__live__"; o.textContent = "📡 Direct";
    dSel.appendChild(o);
  }
  dSel.value = "__live__";
  updateKmDay();
  updLiveBtn();
}
function exitLive() {
  liveMode = false; liveProbe = null;
  wrapEl.classList.remove("direct");  // v5.22.1
  // v5.23 : retirer l'option "📡 Direct" du selecteur de dates
  const dSel = document.getElementById("btDate");
  const oLive = [...dSel.options].find(o => o.value === "__live__");
  if (oLive) oLive.remove();
  if (media[sel]) dSel.value = media[sel].date;
  document.getElementById("cap").style.display = "";   // v5.23.1 : restaurer le bloc photo
  closeProfil();
  prManual = new Set(); prTouched = false;   // retour au defaut a la prochaine ouverture
  openGal(sel);                        // restaurer la photo affichee (galerie classique)
  render();
  updLiveBtn();
}
document.getElementById("btLive").onclick = e => {
  e.stopPropagation();
  if (liveMode) exitLive();
  else if (liveValid()) enterLive();
};

// sonde carte<->profil : point tape (trace ou courbe) + heure la plus proche
function renderLiveProbe() {
  if (probeEl) { probeEl.remove(); probeEl = null; }
  if (!liveMode || !liveProbe) return;
  probeEl = document.createElement("div");
  probeEl.id = "mkprobe";
  probeEl.innerHTML = '<div class="h">' + fmtH(liveProbe.t) + '</div><div class="d"></div>';
  probeEl.style.left = lon2x(liveProbe.lon, zoom) + "px";
  probeEl.style.top = lat2y(liveProbe.lat, zoom) + "px";

function probeFromGraph(x) {            // tap sur la courbe alti live
  if (!prMap || !prMap.blocks.length) return;
  const b = prMap.blocks[0];
  const t = (b.t0 + (x - 42) / (prMap.W - 54) * prMap.Vtot) / 1000;
  let best = null, bd = Infinity;
  for (const p of livePts) {
    const d = Math.abs(p.t - t);
    if (d < bd) { bd = d; best = p; }
  }
  if (best) { liveProbe = best; drawProfil(); renderLiveProbe(); }
}
mapEl.addEventListener("click", e => {  // tap sur la trace live (carte)
  if (!liveMode || !livePts.length || Date.now() - lastDrag < 400) return;
  const mx = e.clientX - mapEl.getBoundingClientRect().left + ox;
  const my = e.clientY - mapEl.getBoundingClientRect().top + oy;
  let best = null, bd = Infinity;
  for (const p of livePts) {
    const d = Math.hypot(lon2x(p.lon, zoom) - mx, lat2y(p.lat, zoom) - my);
    if (d < bd) { bd = d; best = p; }
  }
  if (best && bd < 24) { liveProbe = best; drawProfil(); renderLiveProbe(); }
});

// ---------- rendu ----------

    // SVG au fort zoom, voir renderTraces)
    sg.style.left = ox + "px"; sg.style.top = oy + "px";
    sg.style.width = mapEl.clientWidth + "px";
    sg.style.height = mapEl.clientHeight + "px";
    for (const t of liveTrace) {
      if ((t.geometry.coordinates || []).length < 2) continue;
      const p = document.createElementNS("http://www.w3.org/2000/svg", "polyline");
      p.setAttribute("points", t.geometry.coordinates
        .map(c => (lon2x(c[0], zoom) - ox) + "," + (lat2y(c[1], zoom) - oy)).join(" "));
      p.setAttribute("fill", "none");
      // v5.23.1 : ROUGE vif (#e63946) pour la visibilite (etait orange).
      p.setAttribute("stroke", "#e63946");
      p.setAttribute("stroke-width", 5);
      // v5.22.6 : TIRETS ECHELLES SUR LE ZOOM - dasharray en pixels
      // ecran, les tirets se serraient au dezoom jusqu a fusionner
      // en ligne continue. Espacement ~doublable par niveau de zoom.
      const dash = Math.max(6, Math.round(7 * Math.pow(2, zoom - 14)));
      p.setAttribute("stroke-dasharray", dash + " " + Math.round(dash * 0.85));
      p.setAttribute("stroke-opacity", 0.9);
      p.setAttribute("stroke-linecap", "round");

    }

}
// v5.16 : recentrer la carte sur le MARQUEUR de la photo affichee
// (appele a l'entree en mode "3 fenetres" et a chaque photo en 3F)

// ---------- interactions carte ----------
let drag = null;
// pincé (pinch) : 2 doigts -> zoom. On suit tous les pointeurs actifs.
const pts = new Map();
let pinch = null;
function pinchDist() {
  const a = [...pts.values()];
  return Math.hypot(a[0].x - a[1].x, a[0].y - a[1].y);
}
mapEl.addEventListener("pointerdown", e => {
  pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (pts.size === 2) {   // passage en mode pincé : abandonner le drag
    drag = null;
    pinch = { d0: pinchDist(), z0: zoom };
    mapEl.classList.remove("drag");
    return;
  }
  drag = { x: e.clientX, y: e.clientY, clon, clat, moved: false };
  mapEl.classList.add("drag"); mapEl.setPointerCapture(e.pointerId);
});
mapEl.addEventListener("pointermove", e => {
  if (pts.has(e.pointerId)) pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (pinch && pts.size >= 2) {
    // pincé : ratio de distance -> niveaux de zoom (1 niveau par ~25 %)
    const d = pinchDist();
    let z = pinch.z0 + Math.round(Math.log2(d / pinch.d0) * 2.5);
    z = Math.max(ZMIN, Math.min(ZMAX, z));
    if (z !== zoom) { zoom = z; render(); }
    return;
  }
  if (!drag) return;
  const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
  if (Math.abs(dx) + Math.abs(dy) > 3) drag.moved = true;
  // sens Google Maps : on SAISIT la carte - elle suit le pointeur.
  // glisse gauche => le contenu va a gauche => la zone visible part vers l'EST.
  world.style.transform = "translate(" + (-ox + dx) + "px," + (-oy + dy) + "px)";
});
function endPointer(e) {
  pts.delete(e.pointerId);
  if (pts.size < 2) pinch = null;
  if (!drag) return;
  const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
  const wasMoved = drag.moved;   // v5.13.4 : hit-test marqueur si non-drag
  if (drag.moved) {
    // glisse gauche (dx<0) => centre deplace de -dx => vers l'EST.
    // glisse bas (dy>0) => centre deplace de -dy => vers le NORD.
    const px = lon2x(drag.clon, zoom) - dx;
    const py = lat2y(drag.clat, zoom) - dy;
    clon = px2lon(px); clat = py2lat(py);
    lastDrag = Date.now();
    render();
  }
  drag = null; mapEl.classList.remove("drag");
  // v5.13.4 : CLIC MARQUEUR EN MODE LAPTOP. Le pointerdown fait
  // setPointerCapture(mapEl) : le navigateur redirige alors le clic
  // vers la CAPTUREE (la carte), jamais vers le marqueur - le handler
  // click des marqueurs ne se declenchait donc PAS a la souris (ca
  // marchait au doigt : le click synthetique tactile vise l'element
  // d'origine). Parade : hit-test au pointerup - si le pointeur n'a
  // PAS bouge (pas un drag) et lache sur un marqueur, on ouvre la
  // galerie sur ce media. Le handler click reste pour les navigateurs
  // ou il marche (double appel inoffensif : openGal est idempotent).
  if (!wasMoved) {
    const hit = document.elementFromPoint(e.clientX, e.clientY);
    const mk = hit && hit.closest ? hit.closest(".mk") : null;
    if (mk) {
      const found = marks.find(m => m.el === mk);
      if (found) openGal(found.i);
    }
  }
}
mapEl.addEventListener("pointerup", endPointer);
mapEl.addEventListener("pointercancel", endPointer);
let lastDrag = 0;
mapEl.addEventListener("dblclick", () => { if (zoom < ZMAX) { zoom++; render(); } });
// zoom molette : centre sur le point du curseur (sens Google Maps :
// molette haut = zoom in, molette bas = zoom out)
mapEl.addEventListener("wheel", e => {
  e.preventDefault();
  const dir = e.deltaY < 0 ? 1 : -1;
  if ((dir > 0 && zoom >= ZMAX) || (dir < 0 && zoom <= ZMIN)) return;
  // garder le point sous le curseur fixe : coordonnees avant/apres
  const rect = mapEl.getBoundingClientRect();
  const mx = e.clientX - rect.left, my = e.clientY - rect.top;
  const px = ox + mx, py = oy + my;         // position monde du curseur
  clon = px2lon(px); clat = py2lat(py);     // centre provisoire = curseur
  zoom += dir;
  render();
  // recentrer pour que le point curseur reste a l'ecran ou il etait :
  const px2 = lon2x(clon, zoom), py2 = lat2y(clat, zoom);
  const newOx = px2 - mx, newOy = py2 - my; // origine monde desiree
  // centre final correspondant a cette origine :
  clon = px2lon(newOx + mapEl.clientWidth / 2);
  clat = py2lat(newOy + mapEl.clientHeight / 2);
  render();
}, { passive: false });
document.getElementById("zin").onclick = () => { if (zoom < ZMAX) { zoom++; render(); } };
document.getElementById("zout").onclick = () => { if (zoom > ZMIN) { zoom--; render(); } };

// Si vous changez RESIZE dans config.sh, ajustez la constante en dessous.

// v5.13 : photo PORTRAIT - defilement vertical dans le cadre fixe.
// La miniature portrait fait 600 x H (H libre, ex. 800) : affichee
// pleine largeur, elle depasse le cadre -> glissement vertical borne
// (0 en haut, cadre-image en bas), petite main (cursor grab), depart
// CENTRE. Pointeur souris ET doigt (pointer events + setPointerCapture).
// v5.13.1 : badge d'invitation au glissement - le curseur grab est
// invisible sur Android ; ce badge visible pulse jusqu'au 1er glissement.
function enablePan(el) {
  if (el.classList.contains("tall")) return;   // v5.16.27 : idempotent
  el.classList.add("tall");
  const box = mediaEl;
  let top = 0, y0 = null, hint = null, hintTimer = null;
  function offHint() {
    if (hint) { hint.classList.add("off"); hint = null; }
    if (hintTimer) { clearTimeout(hintTimer); hintTimer = null; }
  }
  requestAnimationFrame(() => {
    const max = Math.min(0, box.clientHeight - el.offsetHeight);
    if (max === 0) { el.classList.remove("tall"); return; } // tient entier
    top = max / 2; el.style.top = top + "px";               // centre
    hint = document.createElement("div");
    hint.id = "panHint";
    hint.textContent = "⇕";
    hint.insertAdjacentHTML("beforeend", "<span style='font-size:15px;font-weight:700'>glisser</span>");
    box.appendChild(hint);
    hintTimer = setTimeout(offHint, 5000);   // lache apres 5 s sans glissement
  });
  el.addEventListener("pointerdown", e => {
    offHint();
    const max = Math.min(0, box.clientHeight - el.offsetHeight);
    if (max === 0) return;
    y0 = e.clientY - top; el.classList.add("drag");
    el.setPointerCapture(e.pointerId); e.preventDefault();
  });
  el.addEventListener("pointermove", e => {
    if (y0 === null) return;
    const max = Math.min(0, box.clientHeight - el.offsetHeight);
    top = Math.max(max, Math.min(0, e.clientY - y0));
    el.style.top = top + "px";
  });
  const fin = () => { y0 = null; el.classList.remove("drag"); };
  el.addEventListener("pointerup", fin);
  el.addEventListener("pointercancel", fin);
}

function openGal(i) {
  if (!media.length) return;
  sel = Math.max(0, Math.min(media.length - 1, i));
  const m = media[sel];
  mediaEl.innerHTML = "";
  let el;
  if (m.type === "video") {
    el = document.createElement("video");
    // "#t=0.1" : fragment media - le navigateur affiche l'image de la
    // video a 0,1 s en vignette (poster) au lieu du fond gris par defaut
    el.src = m.url + "#t=0.1"; el.controls = true; el.playsInline = true;
    el.preload = "metadata";
    fitSideToMedia(el, true);
  } else {
    el = document.createElement("img");
    el.src = m.url; el.alt = "";
    // v5.13 : portrait -> defilement vertical dans le cadre fixe
    // v5.16.26 : en 2F photo+alti, TOUTES les photos sont PLEINE
    // LARGEUR (paysage compris) - la fenetre photo EPINGLEE en px
    // (v5.16.25) avait rendu la boite media trop basse pour un
    // paysage : max-height reduisait la largeur (letterbox lateral).
    // enablePan retire .tall tout seul si la photo tient entier et
    // affiche sinon le badge "glisser" (parties tronquees).
    el.addEventListener("load", () => {
      // v5.16.26 : en 2F photo+alti, TOUTES les photos PLEINE
      // LARGEUR ; enablePan retire .tall seul si la photo tient et
      // affiche sinon le badge "glisser" (parties tronquees).
      if (el.naturalHeight > el.naturalWidth
          || wrapEl.classList.contains("alti")) enablePan(el);

  }
  mediaEl.appendChild(el);
  // v5.16.27 : filet de secours - si l'image est deja en cache, son
  // evenement "load" peut se declencher AVANT l'abonnement (course)
  // et enablePan n'a jamais ete appelee : photo PLEINE LARGEUR non
  // appliquee en 2F alti (letterbox lateral sur paysage en cache).
  if (el.complete && el.naturalWidth
      && wrapEl.classList.contains("alti")
      && !el.classList.contains("tall")) enablePan(el);
  capTxt.textContent = m.name;
  capDate.textContent = m.date;
  const cmtEl = document.getElementById("cmt");

  cmtEl.classList.toggle("on", !!m.commentaire);
  cntEl.textContent = (sel + 1) + " / " + media.length;
  // zone admin : pre-remplir le champ commentaire si mode admin
  if (ADM) { document.getElementById("admTxt").value = m.commentaire || ""; }
  // le menu Date suit le media affiche
  if (profilOn) { syncPrDates(); drawProfil(false);   // v5.16.13 : contenu seul au defilement - geometrie immuable
                 if (wrapEl.classList.contains("p3")) centerActive(); }
  barFlash();                                    // v5.15.6 : barre flottante
  const dSel = document.getElementById("btDate");
  if (dSel.value !== m.date) dSel.value = m.date;
  applySel();
  clon = m.lon; clat = m.lat;
  render();   // recentrage uniquement a l'affichage d'un media
}
// ---------- commentaires (source : photos.csv, lu directement) ----------
// Les commentaires vivent dans photos.csv (publie chaque soir) : la page
// les lit a la volee, ils s'affichent donc pour tout le monde SANS attendre
// la regeneration des geojson. Le champ url du CSV fait la correspondance.
let cmtByUrl = {};
function parseCSVLine(line) {
  const out = []; let cur = "", q = false;
  for (let i = 0; i < line.length; i++) {
    const c = line[i];
    if (q) {
      if (c === '"' && line[i + 1] === '"') { cur += '"'; i++; }
      else if (c === '"') q = false;
      else cur += c;
    } else {
      if (c === '"') q = true;
      else if (c === ",") { out.push(cur); cur = ""; }
      else cur += c;
    }
  }
  out.push(cur);
  return out;
}
async function loadComments() {
  try {
    const r = await fetch(BASE + "/photos.csv?v=" + Date.now());
    if (!r.ok) return;
    const lines = (await r.text()).split(/\r?\n/).filter(Boolean);
    const head = parseCSVLine(lines[0]);
    const iDate = head.indexOf("date"), iNom = head.indexOf("nom"),
          iUrl = head.indexOf("url"), iCmt = head.indexOf("commentaire");
    if (iUrl < 0 || iCmt < 0) return;
    for (const l of lines.slice(1)) {
      const f = parseCSVLine(l);
      if (f.length >= head.length && f[iCmt]) cmtByUrl[f[iUrl]] = f[iCmt];
    }
    // appliquer aux medias deja charges et rafraichir l'affichage
    let changed = false;
    for (const m of media) {
      const c = cmtByUrl[m.url];
      if (c && c !== m.commentaire) { m.commentaire = c; changed = true; }
    }
    if (changed && sel >= 0) {
      const c = document.getElementById("cmt");
      c.textContent = media[sel].commentaire || "";
      c.classList.toggle("on", !!media[sel].commentaire);
    }
  } catch (e) { /* photos.csv absent : commentaires geojson seulement */ }
}
// ---------- mode ADMIN : #adm=<token> dans l'URL ----------
// Le token (PAT GitHub a portee depot, Contents read+write) ne figure QUE
// dans l'URL de votre navigateur (jamais dans le fichier partage) :
// famille/amis n'ont pas de #adm= -> pas de zone de saisie.
const ADM = location.hash.startsWith("#adm=") ? location.hash.slice(5) : null;

document.getElementById("admSave").onclick = async () => {
  const btn = document.getElementById("admSave"), m = media[sel];
  if (!m) return;
  if (!ADM || !REPO) {   // diagnostiquer au lieu de quitter silencieusement
    btn.textContent = "✖ Mode admin indisponible (token ou REPO manquant)";
    setTimeout(() => btn.textContent = "💾 Enregistrer", 4000);
    return;
  }
  const txt = document.getElementById("admTxt").value.trim();
  btn.textContent = "…";
  try {
    // 1. relire le CSV courant via l'API (donne aussi le sha du fichier)
    const g = await fetch("https://api.github.com/repos/" + REPO + "/contents/photos.csv",
                          { headers: { Authorization: "Bearer " + ADM, Accept: "application/vnd.github+json" } });
    if (!g.ok) throw new Error("lecture CSV : HTTP " + g.status);
    const meta = await g.json();
    const lines = new TextDecoder().decode(
      Uint8Array.from(atob(meta.content.replace(/\n/g, "")), c => c.charCodeAt(0)))
      .split(/\r?\n/).filter(Boolean);
    // 2. mettre a jour la ligne du media (cle : url)
    const head = parseCSVLine(lines[0]);
    const iUrl = head.indexOf("url"), iCmt = head.indexOf("commentaire");
    let hit = false;
    for (let i = 1; i < lines.length; i++) {
      const f = parseCSVLine(lines[i]);
      if (f[iUrl] === m.url) {
        // re-encoder la ligne avec le commentaire cite s'il contient virgules/quotes
        f[iCmt] = txt; hit = true;
        lines[i] = f.map(x => /[",\n]/.test(x) ? '"' + x.replace(/"/g, '""') + '"' : x).join(",");
      }
    }
    if (!hit) throw new Error("ligne introuvable dans photos.csv");
    // 3. commit via l'API (seul photos.csv est republie - pas les medias)
    const body = lines.join("\n") + "\n";
    const b64 = btoa(String.fromCharCode(...new TextEncoder().encode(body)));
    const p = await fetch("https://api.github.com/repos/" + REPO + "/contents/photos.csv", {
      method: "PUT",
      headers: { Authorization: "Bearer " + ADM, Accept: "application/vnd.github+json" },
      body: JSON.stringify({
        message: "commentaire " + m.name + " (" + m.date + ")",
        content: b64, sha: meta.sha })
    });
    if (!p.ok) throw new Error("commit : HTTP " + p.status);
    m.commentaire = txt; cmtByUrl[m.url] = txt;
    const c = document.getElementById("cmt");
    c.textContent = txt; c.classList.toggle("on", !!txt);
    btn.textContent = "✔ Enregistré";
  } catch (e) { btn.textContent = "✖ Erreur : " + e.message; }
  setTimeout(() => btn.textContent = "💾 Enregistrer", 3000);
};

const NSVG = "http://www.w3.org/2000/svg";
function photoEpoch(m) {

      ln.setAttribute("y1", 4); ln.setAttribute("y2", H - 16);
      ln.setAttribute("stroke", col); ln.setAttribute("stroke-width", "2");
      ln.setAttribute("stroke-dasharray", "5 4"); svg.appendChild(ln);
      const tx = document.createElementNS(NSVG, "text");

      tx.setAttribute("fill", col); tx.setAttribute("font-weight", "700");
      tx.setAttribute("font-size", big ? "15" : "11");

  ln.setAttribute("x1", x); ln.setAttribute("x2", x);
  ln.setAttribute("y1", 4); ln.setAttribute("y2", prMap.Y(prMap.emin));
  ln.setAttribute("stroke", "#ff7a00"); ln.setAttribute("stroke-width", "2");
  svg.appendChild(ln);
  const dot = document.createElementNS(NSVG, "circle");
  dot.setAttribute("class", "prCur");
  dot.setAttribute("cx", x); dot.setAttribute("cy", prMap.Y(e));
  dot.setAttribute("r", 5); dot.setAttribute("fill", "#ff7a00");
  svg.appendChild(dot);
  const tx = document.createElementNS(NSVG, "text");
  tx.setAttribute("class", "prCur");
  tx.setAttribute("x", Math.min(x + 6, svg.clientWidth - 46));
  tx.setAttribute("y", prMap.Y(e) - 8);
  tx.setAttribute("fill", "#ffb066"); tx.setAttribute("font-size", "12");
  tx.setAttribute("font-weight", "700");
  tx.textContent = Math.round(e) + "m"; svg.appendChild(tx);
}
document.getElementById("prSvg").addEventListener("click", e => {
  // v5.22 : en mode direct, le clic sur la courbe = SONDE (heure la
  // plus proche + pointeur sur la carte), pas d'ouverture de photo.
  if (liveMode) {
    const r = e.currentTarget.getBoundingClientRect();
    probeFromGraph(e.clientX - r.left);
    return;
  }
  // clic inverse : ouvrir la photo la plus proche de l'horodatage clique
  // v5.14.1 : px -> position sur l'axe virtuel contigu -> journee + heure
  if (!prMap) return;
  const r = e.currentTarget.getBoundingClientRect();
  const u = ((e.clientX - r.left) - 42) / (r.width - 54) * prMap.Vtot;
  let blk = null;
  for (const b of prMap.blocks)
    if (u >= b.off && u <= b.off + b.dur) { blk = b; break; }
  if (!blk) return;
  const t = blk.t0 + (u - blk.off);
  let best = -1, bd = Infinity;
  for (let i = 0; i < media.length; i++) {
    const pt = photoEpoch(media[i]);
    if (pt === null) continue;
    const d = Math.abs(pt - t);
    if (d < bd) { bd = d; best = i; }
  }
  if (best >= 0 && bd < 90 * 60 * 1000) openGal(best);   // sinon : clic trop loin de toute photo
});

// v5.16.18 : le badge v5.16.17 a montre la cause exacte : l'animation
// de la barre d'URL produit des paliers espaces de ~140 ms - CHACUN
// survivait au debounce de 120 ms et declenchait son propre tracé FULL
// (H decroissant 330->311 par paliers). Fix : debounce porte a 400 ms
// (les paliers ~140 ms le re-arment en continu, l'animation est
// entierement absorbee) + un seul tracé a la stabilisation.
// v5.16.22 : la vraie cause etait l'AMPLITUDE, pas la cadence : les
// badges successifs montrent des paliers de seulement 4 PX (311->314->
// 318->322->326->330) - la barre d'URL anime le panneau par micro-pas,
// et CHAQUE micro-pas (quelle que soit sa cadence, 140/440/640 ms)
// declenchait un tracé FULL complet. Regle definitive : ne retracer
// que si la hauteur s'est écartee de >= 20 PX depuis le dernier tracé
// (seuil sans effet visuel) ; rotation (largeur) reste IMMEDIATE.
let lastDrawnH = -1, roLastW = -1, settleT = null;
function sizeSettledRedraw(h, w) {
  const wChanged = w !== roLastW;
  const hDelta = Math.abs(h - lastDrawnH);
  roLastW = w;
  if (!profilOn) return;
  if (wChanged || hDelta >= 20) {
    if (settleT) { clearTimeout(settleT); settleT = null; }
    lastPrMode = null; drawProfil();   // lastDrawnH mis a jour par drawProfil
  } else {
    // v5.16.23 : le seuil de 20 px supprimait le scintillement MAIS
    // aussi le tracé FINAL (si l'etat stable est a <20 px du dernier
    // tracé, il n'etait JAMAIS redessine -> "58m" rogne persistant).
    // Filet de securite : tracé unique apres 800 ms sans changement
    // (l'animation, quelle que soit sa cadence, ne le declenche qu'a
    // sa fin ; aucun tracé intermediaire n'est affiche avant).
    if (settleT) clearTimeout(settleT);
    settleT = setTimeout(() => {
      settleT = null;
      if (profilOn) { lastPrMode = null; drawProfil(); }
    }, 800);
  }
}
window.addEventListener("resize", () => {
  sizeSettledRedraw(Math.round(document.getElementById("profil").offsetHeight),

});
new ResizeObserver(entries => {
  if (!profilOn) return;
  const r = entries[0].contentRect;
  sizeSettledRedraw(Math.round(r.height), Math.round(r.width));
})

// ---------- chargement des cumulatifs ----------
async function fetchJ(name) {
  // parametre anti-cache : chaque ouverture de page retelecharge les
  // cumulatifs a jour (sinon le navigateur sert la version en cache,
  // ex. apres une purge les anciennes dates restent affichees)
  const r = await fetch(BASE + "/" + name + "?v=" + Date.now());
  if (!r.ok) throw new Error(name + " : HTTP " + r.status);
  return r.json();
}
function fail(msg) { errEl.textContent = "Erreur de chargement : " + msg; errEl.style.display = "block"; }
async function load() {
  try {
    media = [];
    for (const [f, type] of [["photos.geojson", "photo"], ["videos.geojson", "video"]]) {
      let j; try { j = await fetchJ(f); } catch (e) { if (type === "video") continue; throw e; }
      for (const ft of (j.features || [])) {
        const p = ft.properties || {};
        media.push({
          type, name: p.name || "", date: p.date || "", commentaire: p.commentaire || "",
          url: p.url || "", lon: ft.geometry.coordinates[0], lat: ft.geometry.coordinates[1],
          color: ((p._umap_options || p._storage_options || {}).color) || "#3388ff"
        });
      }
    }
    media.sort((a, b) => (a.date + "|" + a.name).localeCompare(b.date + "|" + b.name));
    media.forEach((m, i) => m.i = i);
    try { traces = (await fetchJ("trace.geojson")).features || []; } catch (e) { traces = []; }
    // v5.17.1 : profil.json au BOOT pour le badge km (variable kmData
    // dediee : le panneau alti garde son chargement differe profilData
    // et la construction de ses puces de dates).
    try { kmData = (await (await fetch(BASE + "/profil.json?v=" + Date.now())).json()).km || null; }
    catch (e) { kmData = null; }
    if (media.length) {
      let n = 90, s = -90, w = 180, e = -180;
      for (const m of media) { n = Math.max(n, m.lat); s = Math.min(s, m.lat); w = Math.min(w, m.lon); e = Math.max(e, m.lon); }
      clat = (n + s) / 2; clon = (w + e) / 2;
      for (zoom = ZMAX; zoom > ZMIN; zoom--) {
        const dx = Math.abs(lon2x(e, zoom) - lon2x(w, zoom));
        const dy = Math.abs(lat2y(s, zoom) - lat2y(n, zoom));
        if (dx < mapEl.clientWidth * 0.85 && dy < mapEl.clientHeight * 0.85) break;
      }
      // zoom intermediaire : +7 niveaux au-dessus du cadrage global
      // (reglage empirique valide par l'utilisateur)
      zoom = Math.min(ZMAX, zoom + 7);
    }
    render();
    // commentaires : la page lit photos.csv en direct (source de verite),
    // puis ouvre la galerie sur la journee la plus RECENTE
    await loadComments();
    buildDateMenu();
    if (media.length) {
      const lastDate = [...new Set(media.map(m => m.date))].sort().pop();
      openGal(media.findIndex(m => m.date === lastDate));
    }
    // v5.16 : a l'ouverture sur SMARTPHONE (2F), demarrer directement
    // en mode "3 FENETRES" (photo+carte+alti = bouton ⛰ de la carte actif)
    if (MOBILE && !wrapEl.classList.contains("single")) {
      await openProfil();
      centerActive();
    }
  } catch (e) { fail(e.message); }
}
